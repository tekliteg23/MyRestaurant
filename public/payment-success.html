<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful</title>


<style>

body{

background:#111;

color:white;

text-align:center;

padding-top:100px;

font-family:Arial, sans-serif;

}


.success-box{

background:#1f1f1f;

width:350px;

margin:auto;

padding:40px;

border-radius:15px;

box-shadow:0 0 20px rgba(0,255,0,0.3);

}


h1{

color:#00ff66;

}


button{

margin-top:20px;

background:#00aa55;

color:white;

border:none;

padding:15px 30px;

border-radius:10px;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#008844;

}


#countdown{

color:#ffd700;

font-size:22px;

font-weight:bold;

}


</style>

</head>



<body>


<div class="success-box">


<h1>
✅ Payment Successful
</h1>


<p>
Your order has been received successfully.
</p>


<p>
Continue ordering again in:
</p>


<p id="countdown">
3
</p>



<button onclick="goOrder()">

🍽 Continue Ordering

</button>


</div>




<script>


let seconds = 3;


const timer = setInterval(()=>{


seconds--;


document.getElementById(
"countdown"
).innerText = seconds;



if(seconds <= 0){


clearInterval(timer);


goOrder();


}


},1000);





function goOrder(){


/*
 Keep login session
 token and user remain in localStorage
 */


const token =
localStorage.getItem("token");


const user =
localStorage.getItem("user");



if(token && user){


window.location.href =
"order.html";


}

else{


window.location.href =
"login.html";


}


}



</script>


</body>


</html>
