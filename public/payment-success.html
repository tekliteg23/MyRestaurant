<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Successful</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#050505;
      color:#fff;
      font-family:'Poppins',Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .success-card{
      background:#111;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:90%;
      max-width:500px;
      box-shadow:0 0 25px rgba(0,255,0,0.15);
    }

    .icon{
      font-size:70px;
      margin-bottom:20px;
    }

    h1{
      margin-bottom:15px;
      color:#00ff66;
    }

    p{
      font-size:18px;
      margin-bottom:15px;
    }

    .countdown{
      color:#aaa;
      font-size:14px;
    }

    .home-btn{
      display:inline-block;
      margin-top:25px;
      padding:12px 25px;
      background:#00aa22;
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-weight:600;
      transition:0.3s;
    }

    .home-btn:hover{
      background:#00cc33;
    }

  </style>

</head>

<body>

  <div class="success-card">

    <div class="icon">
      ✅
    </div>

    <h1>
      Payment Successful
    </h1>

    <p>
      Your order has been received successfully.
    </p>

    <p class="countdown">
      Redirecting to Home Page in
      <span id="timer">3</span>
      seconds...
    </p>

    <a
      href="index.html"
      class="home-btn"
    >
      🏠 Go To Home Now
    </a>

  </div>

  <script>

    let seconds = 3;

    const timer =
      document.getElementById("timer");

    const interval =
      setInterval(() => {

        seconds--;

        if (timer) {
          timer.innerText = seconds;
        }

        if (seconds <= 0) {

          clearInterval(interval);

          window.location.href =
            "index.html";
        }

      }, 1000);

  </script>

</body>
</html>
